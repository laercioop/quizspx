<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#865b3d">
  <meta name="description" content="Teste seus conhecimentos no Quizz Festa de São Pio X.">
  <title>Quizz Festa de São Pio X - 1ª Edição</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Quizz São Pio X — voltar ao início">
      <svg class="brand-mark" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
        <circle cx="20" cy="20" r="18"></circle>
        <path d="M14 14l12 12M26 14L14 26"></path>
      </svg>
      <span class="brand-copy"><strong>Quizz</strong><span>Festa de São Pio X</span></span>
    </a>
  </header>

  <div class="page-shell">
    <main>
      <section class="screen home-screen active" data-screen="home">
        <div class="welcome">
          <div class="edition">1ª EDIÇÃO · FESTA DE SÃO PIO X</div>
          <h1>Conhecimento, tradição e fé</h1>
          <p>Escolha um tema e participe desta primeira edição do nosso desafio de conhecimentos.</p>
        </div>
        <div class="setup-panel">
          <fieldset><legend>Quantas perguntas?</legend><div class="segmented home-mode"><label><input type="radio" name="mode" value="10" checked><span><b>Rápido</b><small>10 perguntas</small></span></label><label><input type="radio" name="mode" value="20"><span><b>Completo</b><small>20 perguntas</small></span></label></div></fieldset>
          <fieldset><legend>Escolha uma categoria</legend><div class="category-grid" data-category-options></div></fieldset>
          <button class="primary home-start" type="button">Iniciar partida <span aria-hidden="true">→</span></button>
        </div>
        <p class="footnote">100 perguntas em 5 temas</p>
      </section>

      <section class="screen quiz-screen" data-screen="quiz" aria-live="polite">
        <div class="quiz-meta"><button class="quit-button" type="button">← Sair</button><span class="question-count"></span><span class="score-live" aria-label="Placar atual"></span></div>
        <div class="progress-track" role="progressbar" aria-label="Progresso da partida" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
        <div class="question-category"></div>
        <h2 class="question-text"></h2>
        <div class="answers" role="group" aria-label="Alternativas"></div>
        <div class="feedback" aria-live="assertive"></div>
        <button class="primary next-button" type="button" hidden>Próxima pergunta →</button>
      </section>

      <section class="screen result-screen" data-screen="result" aria-live="polite">
        <div class="result-seal" aria-hidden="true">★</div>
        <p class="result-kicker">Partida concluída</p>
        <h2 class="result-title"></h2>
        <div class="result-score"><strong></strong><span>acertos</span></div>
        <p class="result-message"></p>
        <div class="result-actions"><button class="primary retry-button" type="button">Jogar novamente</button><button class="secondary share-button" type="button">Compartilhar resultado</button></div>
      </section>
    </main>
  </div>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
